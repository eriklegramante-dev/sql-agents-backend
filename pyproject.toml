[tool.poetry]
name = "sql-agents-backend"
version = "0.1.0"
description = "Backend service for SQL agents."
authors = ["Huelerssey"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pydantic-settings = "*"
email-validator = "*"
sentry-sdk = "*"
fastapi = "*"
uvicorn = "*"
sqlalchemy = "*"
asyncpg = "*"
alembic = "*"
psycopg2-binary = "*"
python-jose = "*"
passlib = "*"
python-multipart = "*"
pytest = "*"
httpx = "*"
pytest-cov = "*"
pytest-asyncio = "*"
pre-commit = "*"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
